<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diary</title>

  <!-- Home Screen app behaviour on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diary">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3a2440" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#241628" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a id="back" class="back" hidden></a>
      <h1 id="title">Today</h1>
      <p id="subtitle"></p>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Sections">
      <a href="#/today" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20v-4L15.5 4.5a2.12 2.12 0 0 1 3 3L7 19H4z"/>
          <path d="M13.5 6.5l3 3"/>
        </svg>
        <span>Today</span>
      </a>
      <a href="#/calendar" data-tab="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
          <path d="M3.5 10h17M8 3v4M16 3v4"/>
          <path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01" stroke-width="2.6"/>
        </svg>
        <span>Calendar</span>
      </a>
      <a href="#/trends" data-tab="trends">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 20h17"/>
          <path d="M4.5 15.5l4.5-4.5 4 3 6.5-7.5"/>
        </svg>
        <span>Trends</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h9M19 7h1M4 17h3M11 17h9"/>
          <circle cx="16" cy="7" r="2.5"/>
          <circle cx="9" cy="17" r="2.5"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
</body>
</html>
